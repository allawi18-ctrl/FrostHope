<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FrostHope - نجاة الصقيع</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 10px;
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 92%;
            max-width: 400px;
            margin: 10px auto;
        }
        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        .stat-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .main-screen {
            flex: 1;
            width: 92%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 10px;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
        }
        .generator-core {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #f97316 0%, #c2410c 70%, #000 100%);
            box-shadow: 0 0 30px #f97316;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 15px #f97316; }
            100% { transform: scale(1.05); box-shadow: 0 0 35px #ea580c; }
        }
        .controls-area {
            width: 92%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            transition: 0.1s;
        }
        .btn:active {
            transform: scale(0.97);
            background: #0369a1;
        }
        .btn-secondary {
            background: #334155;
            box-shadow: none;
        }
        .log-box {
            font-size: 13px;
            color: #cbd5e1;
            min-height: 45px;
            margin-top: 10px;
            line-height: 1.4;
        }
        #gameover-screen {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>FrostHope: ملجأ الصقيع</h1>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">الحرارة</div>
            <div class="stat-value" id="heatVal">100°</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">الفحم</div>
            <div class="stat-value" id="coalVal">50</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">الناجون</div>
            <div class="stat-value" id="survivorsVal">20</div>
        </div>
    </div>

    <div class="main-screen">
        <div id="gameover-screen">
            <h2 style="color: #ef4444; margin-top:0;">انطفأ المولد وتجمد الجميع!</h2>
            <p id="finalDays" style="font-size: 15px; margin-bottom: 20px;"></p>
            <button class="btn" onclick="resetGame()">إعادة بناء الملجأ</button>
        </div>

        <div class="generator-core" id="coreIcon">🔥</div>
        <div style="font-size: 14px; color: #38bdf8; font-weight: bold;">اليوم: <span id="dayVal">1</span></div>
        <div class="log-box" id="gameLog">العاصفة تقترب من الملجأ. حافظ على تشغيل المولد وجمع الفحم للنجاة.</div>
    </div>

    <div class="controls-area">
        <button class="btn" onclick="gatherCoal()">جمع الفحم (+15)</button>
        <button class="btn btn-secondary" onclick="stokeGenerator()">تغذية المولد بالفحم (-10 فحم، +20 حرارة)</button>
    </div>

    <script>
        let days = 1;
        let heat = 100;
        let coal = 50;
        let survivors = 20;
        let isGameOver = false;

        function updateUI() {
            document.getElementById('dayVal').innerText = days;
            document.getElementById('heatVal').innerText = heat + '°';
            document.getElementById('coalVal').innerText = coal;
            document.getElementById('survivorsVal').innerText = survivors;
        }

        function log(text) {
            document.getElementById('gameLog').innerText = text;
        }

        function gatherCoal() {
            if (isGameOver) return;
            let collected = Math.floor(Math.random() * 8) + 12;
            coal += collected;
            log(`نجح فريق الاستكشاف في جلب ${collected وحدة من الفحم من وسط الجليد.`);
            advanceTurn();
        }

        function stokeGenerator() {
            if (isGameOver) return;
            if (coal < 10) {
                log("فحم غير كافٍ لتغذية المولد! اجمع الفحم فوراً.");
                return;
            }
            coal -= 10;
            heat = Math.min(100, heat + 25);
            log("تم إلقاء الفحم في المولد، وارتفعت حرارة الملجأ بشكل ملحوظ.");
            advanceTurn();
        }

        function advanceTurn() {
            if (isGameOver) return;

            days++;
            // تناقص طبيعي للحرارة والفحم مع مرور الأيام والعاصفة
            let heatLoss = Math.floor(Math.random() * 6) + 12;
            heat -= heatLoss;

            if (heat <= 0) {
                heat = 0;
                triggerGameOver();
                return;
            }

            if (heat < 40) {
                let lost = Math.floor(Math.random() * 3) + 1;
                survivors = Math.max(0, survivors - lost);
                log(`تحذير! البرد القارس أدى لفقدان ${lost} من الناجين هذا اليوم.`);
            }

            updateUI();
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('finalDays').innerText = `صمدتم في وجه العاصفة لمدة ${days} أดยاً.`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function resetGame() {
            days = 1;
            heat = 100;
            coal = 50;
            survivors = 20;
            isGameOver = false;
            document.getElementById('gameover-screen').style.display = 'none';
            log("بدأت دورة جديدة من نجاة الصقيع. حافظ على تدفئة الملجأ.");
            updateUI();
        }

        updateUI();
    </script>
</body>
</html>
