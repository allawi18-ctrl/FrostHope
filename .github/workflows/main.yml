name: "Godot Web Export & Deploy"

on:
  push:
    branches:
      - main
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FrostHope</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050b18;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        #ui {
            margin-top: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        canvas {
            background: linear-gradient(to bottom, #0b1329, #1e293b);
            display: block;
            margin: 8px auto;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>
    <div id="ui">FrostHope | النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="350" height="480"></canvas>
    <p style="font-size: 12px; color: #94a3b8; margin: 0;">اضغط يمين أو يسار الشاشة للتحريك</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let player = { x: 175, y: 420, radius: 18, speed: 6 };
        let target = { x: Math.random() * 300 + 25, y: -20, radius: 14, speed: 3.5 };

        window.addEventListener("touchstart", (e) => {
            let touchX = e.touches[0].clientX;
            let canvasRect = canvas.getBoundingClientRect();
            let relativeX = touchX - canvasRect.left;
            
            if (relativeX < canvas.width / 2) {
                player.x = Math.max(25, player.x - 40);
            } else {
                player.x = Math.min(canvas.width - 25, player.x + 40);
            }
        });

        function update() {
            target.y += target.speed;
            
            if (target.y > canvas.height) {
                target.y = -20;
                target.x = Math.random() * (canvas.width - 50) + 25;
            }

            let dist = Math.hypot(player.x - target.x, player.y - target.y);
            if (dist < player.radius + target.radius) {
                score += 10;
                document.getElementById("score").innerText = score;
                target.y = -20;
                target.x = Math.random() * (canvas.width - 50) + 25;
                target.speed += 0.25;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم اللاعب (الناجي في الجليد)
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // رسم جوهرة الدفء
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>

jobs:
  export_web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Setup Godot Templates
        run: |
          mkdir -v -p ~/.local/share/godot/build_templates
          mv /root/.local/share/godot/templates/* ~/.local/share/godot/build_templates/

      - name: Create Web Build Directory
        run: mkdir -v -p build/web

      - name: Export Web
        run: godot --headless --export-release "Web" build/web/index.html

      - name: Deploy to GitHub Pages
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
