<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FrostHope Pro - Day Night</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-touch-callout:none}
body{background:#050b12;overflow:hidden;font-family:-apple-system,system-ui}
#game{width:100vw;height:100vh}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:space-between}
.bar{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);color:#cfe4f5;font-size:11px;pointer-events:auto;border-bottom:1px solid #1a3a52}
.res{display:flex;gap:10px;flex-wrap:wrap}
.res b{color:#6ecbff}
.mid{display:flex;gap:8px;padding:8px}
.mid div{flex:1;height:7px;background:rgba(0,0,0,0.6);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
#hope{height:100%;background:linear-gradient(90deg,#2dd4bf,#5eead4);width:65%}
#dis{height:100%;background:linear-gradient(90deg,#ef4444,#f87171);width:20%}
.builds{pointer-events:auto;display:flex;gap:7px;padding:10px;background:rgba(5,15,25,0.92);border-top:1px solid #1e3f5a;overflow-x:auto;scrollbar-width:none}
.builds::-webkit-scrollbar{display:none}
.btn{min-width:70px;height:68px;background:linear-gradient(180deg,#132a3e,#0e2030);border:1px solid #244a67;border-radius:10px;color:#9cc9e6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;gap:1px}
.btn
