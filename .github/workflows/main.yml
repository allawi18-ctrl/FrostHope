name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v1
        with:
          godot-version: '4.3'

      - name: Build Godot Project for iOS
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/FrostHope.ipa || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostHope-IPA
          path: build/ios/
