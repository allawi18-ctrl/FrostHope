<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❄️ مملكة الجليد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e, #1a2f3f);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 18px 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 12px; letter-spacing: 1px; }
        .day { text-align: center; font-size: 18px; color: #74b9ff; margin-bottom: 14px; }
        .resources {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 14px;
        }
        .res {
            text-align: center;
            background: rgba(255,255,255,0.06);
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 13px;
        }
        .res .icon { font-size: 20px; display: block; }
        .res .value { font-weight: bold; font-size: 16px; }
        .res .value.danger { color: #ff6b6b; }

        .buildings {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .building {
            background: rgba(255,255,255,0.06);
            padding: 10px 8px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .building .name { font-weight: bold; font-size: 15px; }
        .building .level { font-size: 12px; color: #bdc3c7; }
        .building .cost { font-size: 11px; color: #95a5a6; margin-top: 4px; }
        .building button {
            margin-top: 6px;
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            background: #3498db;
            color: white;
            cursor: pointer;
            width: 100%;
        }
        .building button:active { transform: scale(0.95); }
        .building button:disabled { opacity: 0.4; }

        .message {
            background: rgba(0,0,0,0.4);
            padding: 10px 12px;
            border-radius: 12px;
            text-align: center;
            min-height: 44px;
            font-size: 14px;
            margin-bottom: 12px;
            border-left: 4px solid #3498db;
        }
        .message.dead { border-left-color: #e74c3c; background: rgba(231,76,60,0.2); }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .actions button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .actions button:active { transform: scale(0.95); }
        .btn-next { background: #3498db; color: white; grid-column: span 2; }
        .btn-restart { background: #e74c3c; color: white; grid-column: span 2; display: none; }
        .btn-restart.show { display: block; }
        .btn-save { background: #2ecc71; color: white; }
        .btn-reset { background: #e67e22; color: white; }

        .hint {
            font-size: 12px;
            color: #95a5a6;
            text-align: center;
            margin-top: 10px;
        }
        @media (max-width: 400px) {
            .resources { grid-template-columns: repeat(3, 1fr); }
            .buildings { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>❄️ مملكة الجليد</h1>
    <div class="day" id="dayDisplay">📅 اليوم 1</div>

    <div class="resources" id="resources">
        <div class="res"><span class="icon">🪵</span><span class="value" id="wood">20</span></div>
        <div class="res"><span class="icon">🪨</span><span class="value" id="stone">15</span></div>
        <div class="res"><span class="icon">🍖</span><span class="value" id="food">25</span></div>
        <div class="res"><span class="icon">🔥</span><span class="value" id="heat">10</span></div>
        <div class="res"><span class="icon">👥</span><span class="value" id="population">4</span></div>
        <div class="res"><span class="icon">⚔️</span><span class="value" id="soldiers">2</span></div>
    </div>

    <div class="buildings" id="buildings">
        <div class="building" data-building="house">
            <div class="name">🏠 منزل</div>
            <div class="level">المستوى 1</div>
            <div class="cost">🪵5 🪨3</div>
            <button data-action="build">بناء</button>
        </div>
        <div class="building" data-building="storage">
            <div class="name">🏛️ مخزن</div>
            <div class="level">المستوى 1</div>
            <div class="cost">🪵8 🪨5</div>
            <button data-action="build">بناء</button>
        </div>
        <div class="building" data-building="workshop">
            <div class="name">🔨 ورشة</div>
            <div class="level">المستوى 1</div>
            <div class="cost">🪵10 🪨7</div>
            <button data-action="build">بناء</button>
        </div>
        <div class="building" data-building="barracks">
            <div class="name">⚔️ ثكنة</div>
            <div class="level">المستوى 1</div>
            <div class="cost">🪵12 🪨10</div>
            <button data-action="build">بناء</button>
        </div>
    </div>

    <div class="message" id="messageBox">❄️ أهلاً بك في مملكة الجليد!</div>

    <div class="actions">
        <button class="btn-next" id="nextDayBtn">⏳ إنهاء اليوم</button>
        <button class="btn-save" id="saveBtn">💾 حفظ</button>
        <button class="btn-restart" id="restartBtn">🔄 بدء جديد</button>
    </div>
    <div class="hint" id="hint">اضغط "إنهاء اليوم" للتقدم</div>
</div>

<script>
(function() {
    // ----- حالة اللعبة -----
    let state = {
        wood: 20, stone: 15, food: 25, heat: 10,
        population: 4, soldiers: 2,
        buildings: {
            house: { level: 1, built: true },
            storage: { level: 1, built: false },
            workshop: { level: 1, built: false },
            barracks: { level: 1, built: false }
        },
        day: 1,
        alive: true
    };

    const buildingCosts = {
        house: { wood: 5, stone: 3 },
        storage: { wood: 8, stone: 5 },
        workshop: { wood: 10, stone: 7 },
        barracks: { wood: 12, stone: 10 }
    };

    // ----- عناصر DOM -----
    const $ = id => document.getElementById(id);
    const woodEl = $('wood');
    const stoneEl = $('stone');
    const foodEl = $('food');
    const heatEl = $('heat');
    const popEl = $('population');
    const soldiersEl = $('soldiers');
    const dayEl = $('dayDisplay');
    const messageBox = $('messageBox');
    const nextBtn = $('nextDayBtn');
    const restartBtn = $('restartBtn');
    const saveBtn = $('saveBtn');
    const hintEl = $('hint');

    // ----- تحديث الواجهة -----
    function updateUI() {
        woodEl.textContent = state.wood;
        stoneEl.textContent = state.stone;
        foodEl.textContent = state.food;
        heatEl.textContent = state.heat;
        popEl.textContent = state.population;
        soldiersEl.textContent = state.soldiers;
        dayEl.textContent = `📅 اليوم ${state.day}`;

        // ألوان تحذيرية
        [woodEl, stoneEl, foodEl, heatEl].forEach(el => {
            const val = parseInt(el.textContent);
            el.className = 'value' + (val <= 3 ? ' danger' : '');
        });

        // تحديث المباني
        document.querySelectorAll('.building').forEach(el => {
            const type = el.dataset.building;
            const b = state.buildings[type];
            const btn = el.querySelector('button');
            const levelEl = el.querySelector('.level');
            const costEl = el.querySelector('.cost');

            if (b.built) {
                levelEl.textContent = `المستوى ${b.level}`;
                btn.textContent = 'ترقية';
                btn.disabled = false;
                const cost = buildingCosts[type];
                const woodCost = cost.wood * b.level;
                const stoneCost = cost.stone * b.level;
                costEl.textContent = `🪵${woodCost} 🪨${stoneCost}`;
                if (state.wood < woodCost || state.stone < stoneCost) {
                    btn.disabled = true;
                }
            } else {
                levelEl.textContent = 'غير مبني';
                btn.textContent = 'بناء';
                const cost = buildingCosts[type];
                costEl.textContent = `🪵${cost.wood} 🪨${cost.stone}`;
                if (state.wood < cost.wood || state.stone < cost.stone) {
                    btn.disabled = true;
                } else {
                    btn.disabled = false;
                }
            }
        });

        nextBtn.disabled = !state.alive;
        if (!state.alive) {
            messageBox.className = 'message dead';
            restartBtn.classList.add('show');
            hintEl.textContent = '💀 انتهت رحلتك...';
        } else {
            messageBox.className = 'message';
            restartBtn.classList.remove('show');
            hintEl.textContent = 'اضغط "إنهاء اليوم" للتقدم';
        }
    }

    // ----- عرض رسالة -----
    function setMessage(text, isDead = false) {
        messageBox.textContent = text;
        if (isDead) messageBox.className = 'message dead';
        else messageBox.className = 'message';
    }

    // ----- نهاية اللعبة -----
    function gameOver(reason) {
        state.alive = false;
        setMessage(`💀 ${reason} بعد ${state.day} يوماً`, true);
        updateUI();
    }

    // ----- بناء أو ترقية مبنى -----
    function buildBuilding(type) {
        if (!state.alive) return;
        const b = state.buildings[type];
        const cost = buildingCosts[type];
        const woodCost = b.built ? cost.wood * b.level : cost.wood;
        const stoneCost = b.built ? cost.stone * b.level : cost.stone;

        if (state.wood < woodCost || state.stone < stoneCost) {
            setMessage('⚠️ ليس لديك موارد كافية!');
            return;
        }

        state.wood -= woodCost;
        state.stone -= stoneCost;

        if (b.built) {
            b.level++;
            setMessage(`✅ تمت ترقية ${type} إلى المستوى ${b.level}`);
        } else {
            b.built = true;
            b.level = 1;
            setMessage(`✅ تم بناء ${type}`);
            // تأثير المباني
            if (type === 'house') state.population += 2;
            if (type === 'barracks') state.soldiers += 2;
        }

        updateUI();
    }

    // ----- إنهاء اليوم -----
    function endDay() {
        if (!state.alive) return;

        // استهلاك الموارد
        const foodConsumption = 2 + Math.floor(state.population / 2);
        const heatConsumption = 1 + Math.floor(state.population / 4);

        state.food -= foodConsumption;
        state.heat -= heatConsumption;

        // إنتاج الموارد من المباني
        if (state.buildings.workshop.built) {
            state.wood += state.buildings.workshop.level;
            state.stone += state.buildings.workshop.level;
        }

        // حدود دنيا
        state.food = Math.max(0, state.food);
        state.heat = Math.max(0, state.heat);
        state.wood = Math.max(0, state.wood);
        state.stone = Math.max(0, state.stone);

        state.day++;

        // التحقق من الموت
        if (state.food <= 0) { gameOver('نفد الطعام'); return; }
        if (state.heat <= 0) { gameOver('نفد الحطب'); return; }

        // أحداث عشوائية
        const events = [
            '❄️ ليلة باردة، لكنك نجوت!',
            '🌨️ تساقط ثلج كثيف، مدينة صامدة.',
            '🔥 حافظت على النار، أحسنت!',
            '⭐ ليلة هادئة تحت النجوم.',
            '💨 رياح قوية، لكن مدينتك قوية.'
        ];
        setMessage(events[Math.floor(Math.random() * events.length)]);

        updateUI();
    }

    // ----- حفظ اللعبة -----
    function saveGame() {
        if (!state.alive) return;
        localStorage.setItem('frostKingdomSave', JSON.stringify(state));
        setMessage('💾 تم حفظ اللعبة!');
    }

    // ----- تحميل اللعبة -----
    function loadGame() {
        const saved = localStorage.getItem('frostKingdomSave');
        if (saved) {
            try {
                state = JSON.parse(saved);
                setMessage('📂 تم تحميل اللعبة المحفوظة');
                updateUI();
                return true;
            } catch(e) {}
        }
        return false;
    }

    // ----- إعادة التشغيل -----
    function restartGame() {
        if (confirm('هل تريد بدء لعبة جديدة؟ سيتم فقدان التقدم الحالي.')) {
            localStorage.removeItem('frostKingdomSave');
            state = {
                wood: 20, stone: 15, food: 25, heat: 10,
                population: 4, soldiers: 2,
                buildings: {
                    house: { level: 1, built: true },
                    storage: { level: 1, built: false },
                    workshop: { level: 1, built: false },
                    barracks: { level: 1, built: false }
                },
                day: 1,
                alive: true
            };
            setMessage('🔄 بدأت رحلة جديدة!');
            updateUI();
        }
    }

    // ----- ربط الأزرار -----
    document.querySelectorAll('.building button').forEach(btn => {
        btn.addEventListener('click', function() {
            const type = this.closest('.building').dataset.building;
            buildBuilding(type);
        });
    });

    nextBtn.addEventListener('click', endDay);
    saveBtn.addEventListener('click', saveGame);
    restartBtn.addEventListener('click', restartGame);

    // ----- تحميل اللعبة أو بدء جديدة -----
    if (!loadGame()) {
        setMessage('❄️ أهلاً بك في مملكة الجليد!');
    }
    updateUI();

    // حفظ تلقائي كل 30 ثانية
    setInterval(() => {
        if (state.alive) {
            localStorage.setItem('frostKingdomSave', JSON.stringify(state));
        }
    }, 30000);
})();
</script>
</body>
</html>
