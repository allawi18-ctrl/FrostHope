<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة الجليد - نظام الخريطة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a2a3a;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* تنسيق شريط الموارد */
        #resources {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* تنسيق شبكة الخريطة */
        #map-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }

        /* تنسيق المربعات (العناصر) */
        .tile {
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #444;
            position: relative;
            transition: transform 0.2s;
        }

        .tile:hover {
            transform: scale(1.05);
        }

        /* حالات المربع */
        .tile.empty { /* أرض فارغة */
            background-color: #2c3e50;
            color: #7f8c8d;
            cursor: default;
        }

        .tile.ruined { /* المبنى المهدم */
            background-color: #444;
            color: #aaa;
            border-color: #e74c3c;
        }

        .tile.active { /* المبنى النشط */
            background-color: #2ecc71;
            color: #fff;
            border-color: #27ae60;
        }

        /* تنسيق النافذة المنبثقة */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #fff;
            z-index: 100;
            display: none;
            text-align: center;
            width: 300px;
        }

        .popup button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #repair-btn {
            background-color: #e74c3c;
            color: white;
        }

        #close-btn {
            background-color: #7f8c8d;
            color: white;
        }
    </style>
</head>
<body>

    <h1>❄️ مملكة الجليد</h1>

    <!-- شريط الموارد -->
    <div id="resources">
        <span>🪵 خشب: <span id="wood-count">100</span></span>
        <span>🪨 حجر: <span id="stone-count">50</span></span>
    </div>

    <!-- شبكة الخريطة -->
    <div id="map-grid"></div>

    <!-- النافذة المنبثقة (تظهر عند الضغط على مبنى) -->
    <div class="popup" id="popup">
        <h3 id="popup-title">مبنى</h3>
        <p id="popup-desc"></p>
        <p id="popup-cost"></p>
        <button id="repair-btn" onclick="repairBuilding()">🔨 ترميم المبنى</button>
        <button id="close-btn" onclick="closePopup()">إغلاق</button>
    </div>

    <!-- الكود البرمجي للعبة (JavaScript) -->
    <script>
        // 1. الموارد الحالية
        let wood = 100;
        let stone = 50;

        // 2. بيانات المباني (التكلفة والوصف والنوع)
        const buildingData = {
            'house': { name: 'منزل', cost: { wood: 30, stone: 10 }, icon: '🏠', desc: 'عند ترميمه، يزيد عدد سكانك.' },
            'sawmill': { name: 'منشرة خشب', cost: { wood: 10, stone: 20 }, icon: '🪵', desc: 'عند ترميمه، ينتج الخشب.' },
            'mine': { name: 'منجم', cost: { wood: 20, stone: 30 }, icon: '⛏️', desc: 'عند ترميمه، ينتج الحجر.' }
        };

        // 3. الخريطة (5x5) - 'empty' تعني أرض فارغة، و '-ruined' تعني مبنى مهدم
        let mapGrid = [
            ['empty', 'house-ruined', 'empty', 'sawmill-ruined', 'empty'],
            ['empty', 'empty', 'empty', 'house-ruined', 'empty'],
            ['empty', 'mine-ruined', 'empty', 'empty', 'house-ruined'],
            ['empty', 'sawmill-ruined', 'empty', 'empty', 'empty'],
            ['empty', 'empty', 'empty', 'mine-ruined', 'empty']
        ];

        // 4. متغيرات عامة للتفاعل
        const gridContainer = document.getElementById('map-grid');
        const popup = document.getElementById('popup');
        let selectedTileIndex = -1;

        // 5. دالة رسم الخريطة
        function renderMap() {
            gridContainer.innerHTML = ''; // مسح الخريطة القديمة
            mapGrid.forEach((tile, index) => {
                const div = document.createElement('div');
                div.className = 'tile';
                
                // تحديد حالة المربع
                if (tile === 'empty') {
                    div.classList.add('empty');
                    div.textContent = '❔'; // علامة استفهام للأرض الفارغة
                } else if (tile.includes('-ruined')) {
                    div.classList.add('ruined');
                    const type = tile.split('-')[0];
                    div.textContent = buildingData[type].icon + ' (مهدم)';
                    div.onclick = () => openPopup(index); // عند الضغط، يفتح النافذة
                } else if (tile.includes('-active')) {
                    div.classList.add('active');
                    const type = tile.split('-')[0];
                    div.textContent = buildingData[type].icon;
                }

                gridContainer.appendChild(div);
            });
        }

        // 6. دالة فتح النافذة المنبثقة
        function openPopup(index) {
            selectedTileIndex = index;
            const tile = mapGrid[index];
            const type = tile.split('-')[0];
            const data = buildingData[type];

            // تعبئة النافذة بالمعلومات
            document.getElementById('popup-title').textContent = data.name;
            document.getElementById('popup-desc').textContent = data.desc;
            document.getElementById('popup-cost').textContent = `التكلفة: ${data.cost.wood} خشب، ${data.cost.stone} حجر`;
            
            // إظهار النافذة
            popup.style.display = 'block';
        }

        // 7. دالة إغلاق النافذة
        function closePopup() {
            popup.style.display = 'none';
            selectedTileIndex = -1;
        }

        // 8. دالة الترميم (أهم جزء)
        function repairBuilding() {
            if (selectedTileIndex === -1) return;

            const tile = mapGrid[selectedTileIndex];
            const type = tile.split('-')[0];
            const data = buildingData[type];

            // التحقق من توفر الموارد
            if (wood >= data.cost.wood && stone >= data.cost.stone) {
                // خصم الموارد
                wood -= data.cost.wood;
                stone -= data.cost.stone;

                // تحديث المبنى في الخريطة ليكون نشطاً
                mapGrid[selectedTileIndex] = type + '-active';

                // تحديث الواجهة
                updateResourcesUI();
                closePopup();
                renderMap(); // إعادة رسم الخريطة بالحالة الجديدة
                
                alert(`تم ترميم ${data.name} بنجاح! 🎉`);
            } else {
                alert('عذراً، الموارد غير كافية! تحتاج المزيد من الخشب أو الحجر.');
            }
        }

        // 9. دالة تحديث واجهة الموارد
        function updateResourcesUI() {
            document.getElementById('wood-count').textContent = wood;
            document.getElementById('stone-count').textContent = stone;
        }

        // تشغيل اللعبة عند فتح الصفحة
        renderMap();
    </script>
</body>
</html>
