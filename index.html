<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❄️ مدينة الجليد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(145deg, #0b1a2e, #1a2f3f);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 { text-align: center; font-size: 26px; margin-bottom: 16px; }
        .day { text-align: center; font-size: 20px; color: #74b9ff; margin-bottom: 16px; }
        .resources {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 14px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .res {
            text-align: center;
            background: rgba(255,255,255,0.06);
            padding: 8px;
            border-radius: 12px;
        }
        .res .icon { font-size: 24px; display: block; }
        .res .value { font-weight: bold; font-size: 18px; }
        .res .value.danger { color: #ff6b6b; }
        .message {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            min-height: 50px;
            margin-bottom: 16px;
            border-left: 4px solid #3498db;
        }
        .message.dead { border-left-color: #e74c3c; background: rgba(231,76,60,0.2); }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 8px;
        }
        button:active { transform: scale(0.96); }
        .btn-next { background: #3498db; color: white; }
        .btn-next:disabled { opacity: 0.4; }
        .btn-restart { background: #e74c3c; color: white; display: none; }
        .btn-restart.show { display: block; }
        .hint {
            font-size: 13px;
            color: #95a5a6;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>❄️ مدينة الجليد</h1>
    <div class="day" id="dayDisplay">📅 اليوم 1</div>

    <div class="resources">
        <div class="res"><span class="icon">🪵</span><span class="value" id="wood">20</span></div>
        <div class="res"><span class="icon">🪨</span><span class="value" id="stone">15</span></div>
        <div class="res"><span class="icon">🍖</span><span class="value" id="food">25</span></div>
        <div class="res"><span class="icon">🔥</span><span class="value" id="heat">10</span></div>
    </div>

    <div class="message" id="messageBox">❄️ أهلاً بك في مدينة الجليد. قُد شعبك نحو البقاء!</div>

    <button class="btn-next" id="nextDayBtn">⏳ إنهاء اليوم</button>
    <button class="btn-restart" id="restartBtn">🔄 بدء من جديد</button>

    <div class="hint" id="hint">اضغط "إنهاء اليوم" لتتقدم في اللعبة</div>
</div>

<script>
(function() {
    // ----- حالة اللعبة -----
    let state = {
        wood: 20,
        stone: 15,
        food: 25,
        heat: 10,
        day: 1,
        alive: true
    };

    // ----- عناصر DOM -----
    const $ = id => document.getElementById(id);
    const woodEl = $('wood');
    const stoneEl = $('stone');
    const foodEl = $('food');
    const heatEl = $('heat');
    const dayEl = $('dayDisplay');
    const messageBox = $('messageBox');
    const nextBtn = $('nextDayBtn');
    const restartBtn = $('restartBtn');
    const hintEl = $('hint');

    // ----- تحديث الواجهة -----
    function updateUI() {
        woodEl.textContent = state.wood;
        stoneEl.textContent = state.stone;
        foodEl.textContent = state.food;
        heatEl.textContent = state.heat;
        dayEl.textContent = `📅 اليوم ${state.day}`;

        // ألوان تحذيرية
        [woodEl, stoneEl, foodEl, heatEl].forEach(el => {
            const val = parseInt(el.textContent);
            el.className = 'value' + (val <= 3 ? ' danger' : '');
        });

        // تعطيل الزر إذا كان ميتاً
        nextBtn.disabled = !state.alive;

        if (!state.alive) {
            messageBox.className = 'message dead';
            restartBtn.classList.add('show');
            hintEl.textContent = '💀 لقد انتهت رحلتك...';
        } else {
            messageBox.className = 'message';
            restartBtn.classList.remove('show');
            hintEl.textContent = 'اضغط "إنهاء اليوم" لتتقدم في اللعبة';
        }
    }

    // ----- عرض رسالة -----
    function setMessage(text, isDead = false) {
        messageBox.textContent = text;
        if (isDead) messageBox.className = 'message dead';
        else messageBox.className = 'message';
    }

    // ----- نهاية اللعبة -----
    function gameOver(reason) {
        state.alive = false;
        setMessage(`💀 ${reason} بعد ${state.day} يوماً`, true);
        updateUI();
    }

    // ----- إنهاء اليوم -----
    function endDay() {
        if (!state.alive) return;

        // تناقص الموارد اليومي
        state.food -= 2;   // استهلاك الطعام
        state.heat -= 1;   // استهلاك الحطب للتدفئة

        // حدود دنيا
        state.food = Math.max(0, state.food);
        state.heat = Math.max(0, state.heat);
        state.wood = Math.max(0, state.wood);
        state.stone = Math.max(0, state.stone);

        // زيادة اليوم
        state.day++;

        // التحقق من الموت
        if (state.food <= 0) {
            gameOver('نفد الطعام، مات سكانك جوعاً');
            return;
        }
        if (state.heat <= 0) {
            gameOver('نفد الحطب، مات سكانك من البرد');
            return;
        }

        // رسالة عشوائية للتحفيز
        const msgs = [
            '❄️ ليلة باردة أخرى، لكنك نجوت!',
            '🌨️ تساقط الثلج طوال الليل، لكن مدينتك صامدة.',
            '🔥 حافظت على النار مشتعلة، أحسنت!',
            '⭐ ليلة هادئة تحت السماء المتجمدة.'
        ];
        setMessage(msgs[Math.floor(Math.random() * msgs.length)]);

        updateUI();
    }

    // ----- إعادة التشغيل -----
    function restartGame() {
        state = {
            wood: 20,
            stone: 15,
            food: 25,
            heat: 10,
            day: 1,
            alive: true
        };
        setMessage('❄️ بدأت رحلة جديدة في مدينة الجليد');
        updateUI();
    }

    // ----- ربط الأزرار -----
    nextBtn.addEventListener('click', endDay);
    restartBtn.addEventListener('click', restartGame);

    // ----- تهيئة -----
    updateUI();
    setMessage('❄️ أهلاً بك في مدينة الجليد. قُد شعبك نحو البقاء!');
})();
</script>
</body>
</html>
