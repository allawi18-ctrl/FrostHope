<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head><body style="margin:0;background:#081525">
<div id="g"></div>
<script>
new Phaser.Game({type:Phaser.AUTO,parent:'g',width:800,height:600,
scale:{mode:Phaser.Scale.RESIZE},scene:class extends Phaser.Scene{
create(){this.cameras.main.setBackgroundColor('#0f2a44');
this.add.text(400,280,'FrostHope PRO',{fontSize:'28px',color:'#7ee'}).setOrigin(0.5);
this.add.text(400,320,'اضغط لبناء خيمة ⛺',{fontSize:'14px',color:'#9cc'}).setOrigin(0.5);
this.input.on('pointerdown',p=>{this.add.rectangle(p.x,p.y,28,28,0x122f44).setStrokeStyle(1,0x3a6a8c);
this.add.text(p.x,p.y,'⛺',{fontSize:'18px'}).setOrigin(0.5);});
}}});
</script></body></html>
